name: Deploy Chamunda ERP

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          import re
          s=open("site/index.html",encoding="utf-8").read()
          scripts=re.findall(r"<script[^>]*>([\\s\\S]*?)</script>",s,re.I)
          open("/tmp/app.js","w",encoding="utf-8").write(scripts[-1])
          print("Checking script",len(scripts[-1]))
          PY
          node --check /tmp/app.js

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v3
        with:
          project_id: chamunda-erp
          workload_identity_provider: projects/613859592512/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-firebase-deploy@chamunda-erp.iam.gserviceaccount.com

      - name: Inject Firebase API key
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          p="site/index.html"
          s=open(p,encoding="utf-8").read()
          k=os.environ["FIREBASE_API_KEY"]
          s=re.sub(r'apiKey:"[^"]*"', 'apiKey:"'+k+'"', s, count=1)
          open(p,"w",encoding="utf-8").write(s)
          PY

      - name: Deploy Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project chamunda-erp
