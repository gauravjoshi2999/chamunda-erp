const BUILTIN_FIREBASE_CONFIG={
  apiKey:"AIzaSyDK25r1xMH5J_cZiXIC6RSkPs1wfyA8i8Y",
  authDomain:"chamunda-erp.firebaseapp.com",
  databaseURL:"https://chamunda-erp-default-rtdb.firebaseio.com",
  projectId:"chamunda-erp",
  storageBucket:"chamunda-erp.firebasestorage.app",
  messagingSenderId:"613859592512",
  appId:"1:613859592512:web:0ca59647db0a49d60312a5"
};
const today=()=>new Date().toISOString().slice(0,10);
const dmy=d=>{if(!d)return "";let [y,m,dd]=String(d).slice(0,10).split("-");return dd&&m&&y?`${dd}/${m}/${y}`:d};
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const num=n=>Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:3});
let db=load();migrate();
let cloudApp=null,cloudRef=null,cloudUnsub=null,cloudWriting=false,cloudPushTimer=null,cloudReady=false;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){return blank()}}
function blank(){return {sales:[],customers:[],customerPayments:[],bharav:[],royalty:[],dieselIn:[],settings:{materials:["12 MM","6 MM","20 MM","Dust","M-Sand"],bharavRate:150,cloudSync:{enabled:true,config:BUILTIN_FIREBASE_CONFIG,path:"chamundaERP/data"}}}}
function migrate(){
  db.sales??=[];db.sales.forEach((x,i)=>{x._id??=`sale_${x.serial||i+1}_${x.date||today()}_${i}`});
  db.customers??=[];db.customerPayments??=[];db.customerAdjustments??=[];db.settings??={};if(!db.settings.gauravOpeningBalanceSeeded){let g=db.customers.find(c=>String(c?.name||'').trim().toLowerCase()==='gaurav');if(!g){db.customers.push({name:'Gaurav',mobile:'',created:today(),openingBalance:100000});}else if(g.openingBalance==null){g.openingBalance=100000;}db.settings.gauravOpeningBalanceSeeded=true;}db.dieselIn??=[];db.bharav??=[];db.royalty??=[];db.settings??={};db.settings.materials??=["12 MM","6 MM","20 MM","Dust","M-Sand"];db.settings.bharavRate??=150;db.settings.requiredFields??={};db.settings.hiddenMenus??=[];db.settings.customFields??=[];db.settings.cloudSync??={enabled:true,config:BUILTIN_FIREBASE_CONFIG,path:"chamundaERP/data"};db.settings.cloudSync.path??="chamundaERP/data";db.settings.cloudSync.config??=BUILTIN_FIREBASE_CONFIG;db.settings.cloudSync.enabled??=true;localStorage.setItem(KEY,JSON.stringify(db))}
function save(){localStorage.setItem(KEY,JSON.stringify(db)); if(db.settings?.cloudSync?.enabled && !cloudWriting) scheduleCloudPush()}
function cloudStatus(msg,ok=false){let el=document.getElementById('cloudStatus');if(el){el.textContent=msg;el.style.color=ok?'#15803d':'#b45309'}}
function readInput(id,fallback=''){
  const el=document.getElementById(id);
  return el ? String(el.value ?? '').trim() : fallback;
}
function getCloudConfig(){return db.settings?.cloudSync?.config||BUILTIN_FIREBASE_CONFIG}
function scheduleCloudPush(){clearTimeout(cloudPushTimer);cloudPushTimer=setTimeout(cloudPush,150)}
function ensureFirebaseApp(c){
  if(!window.firebase) throw new Error('Firebase SDK load नहीं हुआ। Internet connection check करें।');
  let app=null;
  try{ app=firebase.app('chamundaERP'); }catch(e){ app=firebase.initializeApp(c,'chamundaERP'); }
  return app;
}
function initCloud(){
  try{
    const c=getCloudConfig();
    if(!c || !c.apiKey || !c.projectId || !c.databaseURL){cloudStatus('⚠ Firebase config अधूरी है');return false;}
    if(cloudUnsub){cloudUnsub();cloudUnsub=null;}
    cloudApp=ensureFirebaseApp(c);
    const path=(db.settings?.cloudSync?.path||'chamundaERP/data').trim()||'chamundaERP/data';
    cloudRef=firebase.database(cloudApp).ref(path);
    cloudReady=false;
    cloudStatus('● Connecting...',true);
    cloudUnsub=cloudRef.on('value',snap=>{
      const remote=snap.val();
      if(remote && remote.sales){
        if(cloudWriting) return;
        cloudWriting=true;
        const before=JSON.stringify(remote);
        db=remote;
        migrate();
        const changedByMigration=JSON.stringify(db)!==before;
        localStorage.setItem(KEY,JSON.stringify(db));
        cloudWriting=false;
        cloudReady=true;
        if(changedByMigration) setTimeout(()=>cloudPush(),50);
        cloudStatus('● Live Sync चालू',true);
        if(page==='settings') settings(); else render();
      }else{
        cloudReady=true;
        cloudStatus('● Cloud connected — अभी data नहीं है',true);
        if(db.sales?.length || db.customers?.length) scheduleCloudPush();
      }
    },err=>{
      cloudReady=false;
      cloudStatus('⚠ Cloud error: '+(err.message||'check Rules'));
    });
    return true;
  }catch(e){cloudReady=false;cloudStatus('⚠ Setup error: '+(e.message||e));return false;}
}
function cloudPush(){
  if(!cloudRef||cloudWriting||!cloudReady)return;
  const payload=JSON.parse(JSON.stringify(db));
  cloudWriting=true;
  cloudStatus('● Cloud में save हो रहा है...',true);
  cloudRef.set(payload).then(()=>{
    cloudWriting=false;cloudStatus('● Live Sync चालू',true);
  }).catch(e=>{
    cloudWriting=false;cloudStatus('⚠ Sync failed: '+(e.message||'check Rules'));toast('Cloud save नहीं हुआ');
  });
}
function cloudTest(){
  try{
    const c={
      apiKey:readInput('fbApiKey',BUILTIN_FIREBASE_CONFIG.apiKey),
      authDomain:readInput('fbAuthDomain',BUILTIN_FIREBASE_CONFIG.authDomain),
      databaseURL:readInput('fbDatabaseURL',BUILTIN_FIREBASE_CONFIG.databaseURL),
      projectId:readInput('fbProjectId',BUILTIN_FIREBASE_CONFIG.projectId),
      storageBucket:readInput('fbStorageBucket',BUILTIN_FIREBASE_CONFIG.storageBucket),
      messagingSenderId:readInput('fbMessagingSenderId',BUILTIN_FIREBASE_CONFIG.messagingSenderId),
      appId:readInput('fbAppId',BUILTIN_FIREBASE_CONFIG.appId)
    };
    if(!c.apiKey||!c.projectId||!c.databaseURL||!c.appId){cloudStatus('⚠ API Key, Project ID, Database URL और App ID जरूरी हैं');return;}
    const app=ensureFirebaseApp(c);
    const path=readInput('fbPath',db.settings?.cloudSync?.path||'chamundaERP/data')||'chamundaERP/data';
    const testRef=firebase.database(app).ref(path);
    cloudStatus('● Connection test हो रहा है...',true);
    testRef.once('value').then(()=>{
      cloudStatus('✓ Cloud connection OK',true);toast('Cloud connection OK');
    }).catch(e=>{cloudStatus('⚠ Cloud connection failed: '+(e.message||e));});
  }catch(e){cloudStatus('⚠ Setup error: '+(e.message||e));}
}
function cloudSaveConfig(){
  try{
    const c={
      apiKey:readInput('fbApiKey',BUILTIN_FIREBASE_CONFIG.apiKey),
      authDomain:readInput('fbAuthDomain',BUILTIN_FIREBASE_CONFIG.authDomain),
      databaseURL:readInput('fbDatabaseURL',BUILTIN_FIREBASE_CONFIG.databaseURL),
      projectId:readInput('fbProjectId',BUILTIN_FIREBASE_CONFIG.projectId),
      storageBucket:readInput('fbStorageBucket',BUILTIN_FIREBASE_CONFIG.storageBucket),
      messagingSenderId:readInput('fbMessagingSenderId',BUILTIN_FIREBASE_CONFIG.messagingSenderId),
      appId:readInput('fbAppId',BUILTIN_FIREBASE_CONFIG.appId)
    };
    if(!c.apiKey||!c.projectId||!c.databaseURL||!c.appId){alert('Api Key, Project ID, Database URL और App ID जरूरी हैं।');return;}
    const path=readInput('fbPath',db.settings?.cloudSync?.path||'chamundaERP/data')||'chamundaERP/data';
    db.settings.cloudSync={enabled:true,config:c,path:path};
    localStorage.setItem(KEY,JSON.stringify(db));
    if(!initCloud())return;
    toast('Cloud Sync connect हो गया');
    cloudRef.once('value').then(s=>{
      if(!s.exists()){cloudReady=true;cloudPush();return;}
      if(confirm('Cloud में पहले से data है। OK = Cloud का data इस device में लें; Cancel = इस device का data Cloud में upload करें।')){
        const remote=s.val();
        if(remote){cloudWriting=true;db=remote;migrate();localStorage.setItem(KEY,JSON.stringify(db));cloudWriting=false;cloudReady=true;settings();toast('Cloud data load हो गया');}
      }else cloudPush();
    }).catch(e=>cloudStatus('⚠ Cloud read failed: '+(e.message||e)));
  }catch(e){cloudStatus('⚠ Setup error: '+(e.message||e));}
}
function cloudDisconnect(){
  if(cloudUnsub){cloudUnsub();cloudUnsub=null;}
  cloudRef=null;cloudApp=null;cloudReady=false;
  db.settings.cloudSync.enabled=false;
  localStorage.setItem(KEY,JSON.stringify(db));
  settings();toast('Cloud Sync बंद हो गया');
}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
const pages=[["dashboard","🏠","Dashboard"],["sale","🚛","Sale Entry"],["customers","👥","Customers / Khata"],["bharav","🚜","भराव"],["royalty","📜","Royalty"],["diesel","⛽","Diesel"],["reports","📊","Reports"],["backup","💾","Backup"],["settings","⚙️","Settings"]];
let page="dashboard";

function field(label,name,type="text",value="",extra="",attrs=""){return `<div class="field ${extra}"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${attrs}></div>`}
function select(label,name,opts,value=""){return `<div class="field"><label>${label}</label><select required name="${name}">${opts.map(x=>`<option ${x===value?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`}

function render(){nav();({dashboard:dash,sale,sale:bla,bharav,royalty,diesel,reports,backup}[page]||dash)();if(page==="sale")sale();} 
// explicit dispatcher avoids shorthand ambiguity
function render(){nav();if(page==="dashboard")dash();else if(page==="sale")sale();else if(page==="customers")customers();else if(page==="bharav")bharav();else if(page==="royalty")royalty();else if(page==="diesel")diesel();else if(page==="reports")reports();else if(page==="settings")settings();else backup()}
function req(name){return (db.settings.requiredFields||{})[name]===false?"":"required"}
function normalizeWeight(raw){const s=String(raw??'').trim();if(!s)return null;const n=Number(s);if(!Number.isFinite(n)||n<=0)return null;if(s.includes('.'))return Number(n.toFixed(3));if(n>=1000)return Number((n/1000).toFixed(3));return Number(n.toFixed(3))}
function nextSerial(){return Math.max(0,...db.sales.map(x=>Number(x.serial)||0))+1}
function totals(){let sales=db.sales;return{entries:sales.length,weight:sales.reduce((a,x)=>a+Number(x.weight||0),0),amount:sales.reduce((a,x)=>a+Number(x.total||0),0),cash:sales.filter(x=>x.payment==="Cash").reduce((a,x)=>a+Number(x.total||0),0),udhar:sales.filter(x=>x.payment==="Udhar").reduce((a,x)=>a+Number(x.total||0),0)}}
function dash(){let t=totals(), b=db.bharav.filter(x=>x.date===today()).reduce((a,x)=>a+Number(x.tractors||0),0),ri=db.dieselIn.filter(x=>x.date===today()).reduce((a,x)=>a+Number(x.litres||0),0);document.getElementById("app").innerHTML=header("Office Dashboard","आज की entry के लिए आसान screen",`<button class="btn primary" onclick="go('sale')">+ नई Sale Entry</button>`)
+`<div class="cards"><div class="card"><div class="label">आज की Sale Entries</div><div class="num">${t.entries}</div></div><div class="card"><div class="label">Total Weight</div><div class="num">${num(t.weight)} MT</div></div><div class="card"><div class="label">Total Sale</div><div class="num">${money(t.amount)}</div></div><div class="card"><div class="label">Cash</div><div class="num">${money(t.cash)}</div></div><div class="card"><div class="label">Udhar</div><div class="num">${money(t.udhar)}</div></div></div>`

+`<div class="panel"><h3>Entry करने का आसान तरीका</h3><div class="notice">पहले Customer चुनें/नाम लिखें → Material चुनें → Weight डालें → Rate डालें → Payment में Cash या Udhar चुनें → <b>Save Entry</b> दबाएँ। Total अपने-आप निकलेगा।</div><div class="muted">गलती हो जाए तो Daily Register में उस row को Delete करके सही entry दोबारा कर सकते हैं।</div></div>`}
function sale(){let rows=db.sales.slice().reverse(),names=[...new Set(db.customers.map(c=>c.name).concat(db.sales.map(x=>x.customer)))].filter(Boolean),cf=db.settings.customFields||[];document.getElementById("app").innerHTML=header("Daily Sale / Dispatch Entry","Date calendar से चुनें — पुराने customer option में मिलेंगे",'<button class="btn" onclick="go(\'reports\')">📊 Report</button>')+`<div class="panel"><h3>नई Sale Entry</h3><div class="notice">Weight: <b>9</b> = 9 MT, <b>9000</b> = 9 MT, <b>9.000</b> = 9 MT. <b>Total = Weight × Rate</b>.</div><form id="saleForm"><div class="grid">${field("Serial No. (Auto)","serial","text",nextSerial(),"","readonly")}${field("Date (DD/MM/YYYY)","date","date",today(),"",req("date"))}${field("RST No.","rst","text","","",req("rst"))}<div class="field"><label>Customer Name</label><input name="customer" list="customerNames" autocomplete="off" ${req("customer")}><datalist id="customerNames">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div>${select("Material","material",db.settings.materials)}${field("Place","place","text","","",req("place"))}${field("Weight (MT)","weight","text","","",req("weight")+" inputmode=\"decimal\"")}${field("Rate","rate","number","","",req("rate")+" min=\"0\" step=\"0.01\"")}${field("Total (Auto)","totalPreview","text","","","readonly")}${field("Vehicle Number","vehicle","text","","",req("vehicle"))}${field("Naka Parchi","naka","text","","",req("naka"))}${field("Mobile Number","mobile","tel","","",req("mobile")+" pattern=\"[0-9]{10}\" maxlength=\"10\" inputmode=\"numeric\"")}${select("Payment","payment",["Cash","Udhar"])}${field("Remark","remark","text","","span2",req("remark"))}${cf.map(f=>field(f.label,f.key,f.type||"text","",f.span2?"span2":f.key,f.required!==false?"required":"")).join("")}</div><div class="actions"><button type="reset" class="btn">Clear</button><button type="submit" class="btn green">✓ Save Entry</button><button type="button" class="btn primary" onclick="saveSaleAndA <div class="reportgrid"><div class="reportbox">Cash Sale<b>${money(cash)}</b></div><div class="reportbox">Udhar Sale<b>${money(udhar)}</b></div><div class="reportbox">भराव Tractor<b>${bt}</b></div><div class="reportbox">Royalty Difference<b>${num(db.royalty.filter(x=>x.date===d).reduce((a,x)=>a+(+x.original||0)-(+x.naka||0),0))} MT</b></div></div>
<div class="panel"><h3>Month Calendar Summary</h3><div class="tablewrap"><table><tr><th>Date</th><th>Sale</th><th>Weight</th><th>Cash</th><th>Udhar</th><th>भराव Tractor</th><th>Royalty Difference</th></tr>${monthRows()}</table></div></div>`}
function monthRows(){let m=today().slice(0,7),days=[];for(let i=1;i<=31;i++){let dt=`${m}-${String(i).padStart(2,"0")}`;let chk=new Date(dt);if(chk.getMonth()+1!==Number(m.slice(5)))continue;let s=db.sales.filter(x=>x.date===dt),b=db.bharav.filter(x=>x.date===dt).reduce((a,x)=>a+x.tractors,0),r=db.royalty.filter(x=>x.date===dt).reduce((a,x)=>a+(+x.original||0)-(+x.naka||0),0);if(s.length||b||r)days.push(`<tr><td>${dt}</td><td>${money(s.reduce((a,x)=>a+x.total,0))}</td><td>${num(s.reduce((a,x)=>a+x.weight,0))} MT</td><td>${money(s.filter(x=>x.payment==="Cash").reduce((a,x)=>a+x.total,0))}</td><td>${money(s.filter(x=>x.payment==="Udhar").reduce((a,x)=>a+x.total,0))}</td><td>${b}</td><td>${num(r)} MT</td></tr>`)}return days.join("")||'<tr><td colspan="7">इस महीने अभी कोई saved entry नहीं है।</td></tr>'}
function settings(){let fields=[['date','Date'],['rst','RST No.'],['customer','Customer Name'],['place','Place'],['weight','Weight'],['rate','Rate'],['vehicle','Vehicle Number'],['naka','Naka Parchi'],['mobile','Mobile Number'],['remark','Remark']];let custom=db.settings.customFields||[];let c=db.settings.cloudSync?.config||BUILTIN_FIREBASE_CONFIG;let enabled=!!db.settings.cloudSync?.enabled;document.getElementById('app').innerHTML=header('Settings','Compulsory field, menu, custom field और Cloud Sync यहाँ manage करें')+`<div class="panel"><h3>☁️ Cloud Sync Setup</h3><div class="notice">एक ही Firebase Realtime Database connect करने पर laptop और mobile में data live synchronize होगा। Firebase पहले से Chamunda ERP के साथ configured है। नीचे config केवल reference/advanced change के लिए है। Live Sync अपने-आप चालू होता है।</div><div class="grid"><div class="field"><label>API Key</label><input id="fbApiKey" value="${esc(c.apiKey||'')}" placeholder="AIza..."></div><div class="field"><label>Auth Domain</label><input id="fbAuthDomain" value="${esc(c.authDomain||'')}" placeholder="project.firebaseapp.com"></div><div class="field"><label>Database URL</label><input id="fbDatabaseURL" value="${esc(c.databaseURL||'')}" placeholder="https://project-default-rtdb.firebaseio.com"></div><div class="field"><label>Project ID</label><input id="fbProjectId" value="${esc(c.projectId||'')}"></div><div class="field"><label>Storage Bucket</label><input id="fbStorageBucket" value="${esc(c.storageBucket||'')}"></div><div class="field"><label>Messaging Sender ID</label><input id="fbMessagingSenderId" value="${esc(c.messagingSenderId||'')}"></div><div class="field"><label>App ID</label><input id="fbAppId" value="${esc(c.appId||'')}"></div><div class="field"><label>Cloud Path</label><input id="fbPath" value="${esc(db.settings.cloudSync?.path||'chamundaERP/data')}"></div></div><div class="actions"><button class="btn" onclick="cloudTest()">🔌 Test Connection</button><button class="btn primary" onclick="cloudSaveConfig()">☁️ Save & Start Live Sync</button>${enabled?'<button class="btn danger" onclick="cloudDisconnect()">Disconnect</button>':''}</div><p class="muted" id="cloudStatus">${enabled?'● Cloud Sync configured':'○ Cloud Sync बंद है'}</p></div><div class="panel"><h3>Sale Entry में Compulsory Fields</h3><div class="grid">${fields.map(([k,l])=>`<label style="display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #ddd;border-radius:8px"><input type="checkbox" ${req(k)==='required'?'checked':''} onchange="db.settings.requiredFields['${k}']=this.checked;save();settings()"> ${l}</label>`).join('')}</div></div><div class="panel"><h3>नया Field जोड़ें</h3><div class="grid"><div class="field"><label>Field का नाम</label><input id="newFieldLabel" placeholder="जैसे Driver Name"></div><div class="field"><label>Type</label><select id="newFieldType"><option value="text">Text</option><option value="number">Number</option></select></div><div class="field" style="align-self:end"><button class="btn green" onclick="addCustomField()">+ Field जोड़ें</button></div></div><div class="tablewrap"><table><tr><th>Field</th><th>Type</th><th>Compulsory</th><th>Delete</th></tr>${custom.map(f=>`<tr><td>${esc(f.label)}</td><td>${esc(f.type||'text')}</td><td><input type="checkbox" ${f.required!==false?'checked':''} onchange="setCustomRequired('${f.key}',this.checked)"></td><td><button class="btn danger" onclick="deleteCustomField('${f.key}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="4">अभी कोई custom field नहीं है।</td></tr>'}</table></div></div><div class="panel"><h3>Menu दिखाएँ / छुपाएँ</h3><div class="grid">${pages.filter(p=>!['dashboard','settings'].includes(p[0])).map(p=>`<label style="display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #ddd;border-radius:8px"><input type="checkbox" ${!(db.settings.hiddenMenus||[]).includes(p[0])?'checked':''} onchange="toggleMenu('${p[0]}',this.checked)"> ${p[1]} ${p[2]}</label>`).join('')}</div></div><div class="panel"><h3>भराव Rate</h3><button class="btn" onclick="editBharavRate()">Rate Edit करें (अभी ${money(db.settings.bharavRate??150)})</button></div>`;if(enabled)initCloud()}
function addCustomField(){let label=document.getElementById('newFieldLabel').value.trim(),type=document.getElementById('newFieldType').value;if(!label)return alert('Field का नाम डालें');let key='custom_'+Date.now();db.settings.customFields??=[];db.settings.customFields.push({key,label,type,required:true});save();toast('नया field जुड़ गया');settings()}
function setCustomRequired(key,v){let f=(db.settings.customFields||[]).find(x=>x.key===key);if(f){f.required=v;save()}}
function deleteCustomField(key){if(!confirm('यह custom field delete करना है?'))return;db.settings.customFields=(db.settings.customFields||[]).filter(x=>x.key!==key);db.sales.forEach(x=>delete x[key]);save();toast('Field delete हो गया');settings()}
function toggleMenu(id,show){db.settings.hiddenMenus??=[];db.settings.hiddenMenus=show?db.settings.hiddenMenus.filter(x=>x!==id):[...new Set([...db.settings.hiddenMenus,id])];save();nav()}
function backup(){document.getElementById("app").innerHTML=header("Backup & Restore","आपके data की सुरक्षा के लिए",`<button class="btn" onclick="go('dashboard')">← Dashboard</button>`)+
`<div class="panel"><h3>💾 Backup निकालें</h3><p class="muted">Backup file को सुरक्षित जगह रखें। Mobile/PC बदलने पर Restore कर सकते हैं।</p><button class="btn primary" onclick="downloadBackup()">Download Backup</button></div>
<div class="panel"><h3>📥 Bulk Excel / CSV Import</h3>
<p class="muted">एक महीने की Sale/Dispatch entries एक साथ import करें। <b>.xlsx, .xls या .csv</b> file चलेगी। पहले Preview होगा; उसके बाद ही data save होगा।</p>
<div class="notice"><b>Excel columns:</b> Date, Customer, Material, Place, Weight, Rate, Vehicle, Naka Parchi, Mobile, Payment, Remark, RST No.<br><b>Weight:</b> 9 = 9 MT, 9000 = 9 MT, 9.000 = 9 MT, 12.530 = 12.530 MT. Total अपने-आप Weight × Rate होगा।</div>
<div class="actions" style="justify-content:flex-start"><button class="btn" onclick="downloadImportTemplate()">⬇ Download Excel Template</button><input id="bulkImportFile" type="file" accept=".xlsx,.xls,.csv" onchange="previewBulkImport(event)"></div>
<div id="bulkImportPreview" style="margin-top:12px"></div>
</div>
<div class="panel"><h3>↩ Restore</h3><input type="file" id="restore" accept=".json"><p class="muted">सिर्फ Chamunda ERP की backup JSON file चुनें।</p></div>
<div class="panel"><h3>⚠️ Data Reset</h3><button class="btn danger" onclick="resetData()">सारा local data delete करें</button></div>`;
document.getElementById("restore").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.sales||!x.settings)throw Error();db=x;save();toast("Backup restore हो गया");go("dashboard")}catch(err){alert("यह valid Chamunda ERP backup नहीं है।")}};r.readAsText(f)}
}

let bulkImportRows=[];
function bulkHeaderKey(v){return String(v??'').trim().toLowerCase().replace(/[._\-\/\s]+/g,'').replace(/[()]/g,'')}
function bulkValue(row,names){for(const n of names){const k=bulkHeaderKey(n);if(Object.prototype.hasOwnProperty.call(row,k))return row[k];}return ''}
function parseImportDate(v){
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  const s=String(v??'').trim(); if(!s)return '';
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){const [y,m,d]=s.split('-');return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
  let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
  const dt=new Date(s); if(!isNaN(dt))return dt.toISOString().slice(0,10);
  return '';
}
function parseImportWeight(v){return normalizeWeight(String(v??''))}
function bulkFingerprint(x){return [x.date,x.rst,x.customer,x.material,x.place,x.weight,x.rate,x.vehicle,x.naka,x.mobile,x.payment,x.remark].map(v=>String(v??'').trim().toLowerCase()).join('|')}
function previewBulkImport(e){
  const f=e.target.files?.[0]; if(!f)return;
  if(typeof XLSX==='undefined'){alert('Excel reader load नहीं हुआ। Internet connection check करें।');return}
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]]; const raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
      if(!raw.length)throw Error('Excel/CSV में कोई data row नहीं मिली।');
      bulkImportRows=raw.map((r,idx)=>{
        const row={};Object.keys(r).forEach(k=>row[bulkHeaderKey(k)]=r[k]);
        const date=parseImportDate(bulkValue(row,['Date','दिनांक','तारीख']));
        const customer=String(bulkValue(row,['Customer','Customer Name','ग्राहक','ग्राहक नाम'])).trim();
        const material=String(bulkValue(row,['Material','सामग्री'])).trim();
        const place=String(bulkValue(row,['Place','स्थान'])).trim();
        const weight=parseImportWeight(bulkValue(row,['Weight','Weight (MT)','Qty','Quantity','वजन']));
        const rate=Number(bulkValue(row,['Rate','रेट']))||0;
        const vehicle=String(bulkValue(row,['Vehicle','Vehicle No','Vehicle Number','गाड़ी','गाड़ी नंबर'])).trim();
        const naka=String(bulkValue(row,['Naka Parchi','Naka','नाका पर्ची'])).trim();
        const mobile=String(bulkValue(row,['Mobile','Mobile Number','मोबाइल'])).replace(/\D/g,'');
        const payment=String(bulkValue(row,['Payment','Payment Mode','भुगतान'])).trim()||'Cash';
        const remark=String(bulkValue(row,['Remark','Remarks','टिप्पणी'])).trim();
        const rst=String(bulkValue(row,['RST No','RST','RST Number','आरएसटी'])).trim();
        const errors=[]; if(!date)errors.push('Date'); if(!customer)errors.push('Customer'); if(!material)errors.push('Material'); if(weight===null)errors.push('Weight'); if(!rate||rate<0)errors.push('Rate'); if(mobile && !/^\d{10}$/.test(mobile))errors.push('Mobile');
        return {rowNo:idx+2,date,customer,material,place,weight,rate,vehicle,naka,mobile,payment:/^udhar$/i.test(payment)?'Udhar':'Cash',remark,rst,total:weight===null?0:Number((weight*rate).toFixed(2)),errors};
      });
      const valid=bulkImportRows.filter(x=>!x.errors.length), invalid=bulkImportRows.length-valid.length;
      document.getElementById('bulkImportPreview').innerHTML=`<div class="notice"><b>${bulkImportRows.length}</b> rows मिलीं • <b>${valid.length}</b> ready • <b>${invalid}</b> में error</div>`+
      `<div class="tablewrap"><table><tr><th>Row</th><th>Date</th><th>Customer</th><th>Material</th><th>Weight</th><th>Rate</th><th>Total</th><th>Status</th></tr>${bulkImportRows.slice(0,50).map(x=>`<tr><td>${x.rowNo}</td><td>${dmy(x.date)||'-'}</td><td>${esc(x.customer)}</td><td>${esc(x.material)}</td><td>${x.weight===null?'-':num(x.weight)}</td><td>${money(x.rate)}</td><td>${money(x.total)}</td><td>${x.errors.length?'<span style="color:#b42318">Error: '+esc(x.errors.join(', '))+'</span>':'<span style="color:#15803d">✓ Ready</span>'}</td></tr>`).join('')}</table></div>`+
      (bulkImportRows.length>50?`<p class="muted">पहली 50 rows preview में दिख रही हैं; बाकी भी import होंगी।</p>`:'')+
      `<div class="actions"><button class="btn" onclick="cancelBulkImport()">Cancel</button><button class="btn green" ${invalid?'disabled':''} onclick="commitBulkImport()">✓ Import ${valid.length} Entries</button></div>`;
    }catch(err){bulkImportRows=[];document.getElementById('bulkImportPreview').innerHTML='<div class="notice" style="background:#fff1f0;color:#9b1c1c">'+esc(err.message||'File पढ़ने में error')+'</div>'}
  };reader.readAsArrayBuffer(f);
}
function commitBulkImport(){
  const rows=bulkImportRows.filter(x=>!x.errors.length); if(!rows.length)return alert('Import करने के लिए valid rows नहीं हैं।');
  const existing=new Set(db.sales.map(bulkFingerprint)); let added=0,skipped=0;
  rows.forEach(x=>{const sale={date:x.date,serial:nextSerial(),rst:x.rst,customer:x.customer,material:x.material,place:x.place,weight:x.weight,rate:x.rate,total:x.total,vehicle:x.vehicle,naka:x.naka,mobile:x.mobile,payment:x.payment,remark:x.remark,_id:`sale_${Date.now()}_${Math.random().toString(36).slice(2,9)}`};const fp=bulkFingerprint(sale);if(existing.has(fp)){skipped++;return}existing.add(fp);db.sales.push(sale);if(x.customer&&!db.customers.some(c=>c.name.toLowerCase()===x.customer.toLowerCase()))db.customers.push({name:x.customer,mobile:x.mobile||'',created:x.date});added++});
  save(); toast(`${added} entries import हो गईं${skipped?` • ${skipped} duplicate skip`:''}`); bulkImportRows=[];const el=document.getElementById('bulkImportPreview');if(el)el.innerHTML=`<div class="notice" style="background:#eaf8ef;color:#126b34"><b>Import complete:</b> ${added} नई entries saved${skipped?`, ${skipped} duplicate rows skip हुईं`:''}.</div>`;
}
function cancelBulkImport(){bulkImportRows=[];const el=document.getElementById('bulkImportPreview');if(el)el.innerHTML='';const f=document.getElementById('bulkImportFile');if(f)f.value=''}
function downloadImportTemplate(){
  const rows=[{Date:today(),Customer:'ABC',Material:'12 MM',Place:'Jaipur',Weight:9,Rate:1200,Vehicle:'RJ14XX1234','Naka Parchi':'12345',Mobile:'9876543210',Payment:'Udhar',Remark:'', 'RST No':'RST001'}];
  if(typeof XLSX!=='undefined'){const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sale Import');XLSX.writeFile(wb,'Chamunda-ERP-Sale-Import-Template.xlsx');}
  else {const csv='Date,Customer,Material,Place,Weight,Rate,Vehicle,Naka Parchi,Mobile,Payment,Remark,RST No\n'+Object.values(rows[0]).map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Chamunda-ERP-Sale-Import-Template.csv';a.click();}
}
function downloadBackup(){let a=document.createElement("a"),blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});a.href=URL.createObjectURL(blob);a.download=`Chamunda-ERP-Backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm("सारा local data delete करना है? पहले backup ले लें।")){db=blank();save();go("dashboard");toast("Data reset हो गया")}}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}));
if(db.settings?.cloudSync?.enabled) setTimeout(()=>initCloud(),200);
render();
</script>
</body></html>
