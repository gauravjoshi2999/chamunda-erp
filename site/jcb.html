<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769d3"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><link rel="manifest" href="/manifest.json">
<title>JCB Entry • Chamunda ERP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#17202a}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{width:min(100%,520px);background:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 40px #0002}
.head{text-align:center}.logo{font-size:58px}.head h1{margin:4px 0;font-size:28px}.head p{margin:4px 0 20px;color:#64748b}.info{background:#eef5ff;border-radius:13px;padding:12px;text-align:center;margin-bottom:16px;font-weight:750}
h2{text-align:center;font-size:24px;margin:12px 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;cursor:pointer}
.choice{min-height:145px;border:2px solid #d8e1ea;border-radius:16px;background:#fff;font-size:24px;font-weight:900}.choice.selected{border-color:#1769d3;background:#eef5ff}
.materials{display:grid;grid-template-columns:1fr 1fr;gap:9px}.material{min-height:64px;border:1px solid #cbd5df;border-radius:12px;background:#fff;font-size:18px;font-weight:800}.material.selected{background:#1769d3;color:#fff;border-color:#1769d3}
.actions{display:flex;gap:9px;margin-top:16px}.btn{flex:1;min-height:56px;border:0;border-radius:12px;font-weight:850;font-size:18px}.back{background:#eef2f5}.submit{background:#15803d;color:#fff}
.success{background:#eaf8ef;color:#126b34;border-radius:15px;padding:18px;text-align:center;font-size:19px;font-weight:800}.error{background:#fff1f0;color:#a61b12;border-radius:12px;padding:12px;text-align:center;margin-top:12px}
.sync{font-size:14px;text-align:center;margin:8px 0 14px;color:#64748b}.offline{color:#a15c00}.online{color:#126b34}
@media(max-width:420px){.wrap{padding:9px}.card{padding:15px;border-radius:18px}.choice{min-height:125px;font-size:21px}.material{font-size:16px}}
</style></head>
<body><div class="wrap"><div class="card"><div class="head"><div class="logo">🚜</div><h1>JCB Loading Entry</h1><p>Chamunda ERP</p></div><div id="sync" class="sync">⏳ तैयार हो रहा है...</div><div id="app"><div class="info">⏳ Software शुरू हो रहा है...</div></div></div></div>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyDK25r1xMH5J_cZiXICR6SkPslwfyA8i8Y8",authDomain:"chamunda-erp.firebaseapp.com",databaseURL:"https://chamunda-erp-default-rtdb.firebaseio.com",projectId:"chamunda-erp",storageBucket:"chamunda-erp.firebasestorage.app",messagingSenderId:"613859592512",appId:"1:613859592512:web:0ca59647db0a49d60312a5"};
const app=document.getElementById('app'),syncBox=document.getElementById('sync');const today=()=>new Date().toISOString().slice(0,10);const dmy=d=>{const [y,m,dd]=String(d).slice(0,10).split('-');return dd+'/'+m+'/'+y};const timeNow=()=>new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let dbRef=null,materials=['6 MM','10 MM','12 MM','40 MM','Dust','WMM','भराव'],state={step:1,vehicle:'',material:''};

const IDB='jcbOfflineDB',STORE='queue',LS='jcbOfflineQueue';let idb;
function lsAll(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch{return[]}}
function lsSave(a){try{localStorage.setItem(LS,JSON.stringify(a));return true}catch{return false}}
function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open(IDB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function queueAdd(x){if(idb){try{await new Promise((res,rej)=>{const tx=idb.transaction(STORE,'readwrite');tx.objectStore(STORE).add(x);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}catch(e){}}const a=lsAll();x.id='ls_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);a.push(x);if(!lsSave(a))throw new Error('offline save failed');return true}
async function queueAll(){let out=[];if(idb){try{out=await new Promise((res,rej)=>{const tx=idb.transaction(STORE,'readonly'),r=tx.objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){}}return out.concat(lsAll())}
async function queueDel(id){if(String(id).startsWith('ls_')){lsSave(lsAll().filter(x=>x.id!==id));return}if(idb){try{await new Promise((res,rej)=>{const tx=idb.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}}
async function pendingCount(){try{return (await queueAll()).length}catch{return lsAll().length}}
async function status(){const n=await pendingCount();syncBox.className='sync '+(navigator.onLine?'online':'offline');syncBox.textContent=n?(navigator.onLine?'🟢 Online':'📴 Offline'):(navigator.onLine?'🟢 Ready':'📴 Offline');}
async function flushQueue(){if(!navigator.onLine||!dbRef)return;const items=await queueAll();for(const q of items){try{await firebase.database().ref('chamundaERP/data/jcbEntries').child(q.entry._id).set({...q.entry,status:'submitted',source:'jcb-mobile'});await queueDel(q.id)}catch(e){syncBox.className='sync offline';syncBox.textContent='⚠️ Firebase Sync Error: '+(e.code||e.message||'unknown');return}}await status()}
function render(){const mats=[...new Set(materials)];let html='<div class="info">आज: '+dmy(today())+'</div>';if(state.step===1){html+='<h2>1️⃣ गाड़ी चुनें</h2><div class="grid"><button class="choice" onclick="pickVehicle(\'Dumper\')">🚚<br>DUMPER</button><button class="choice" onclick="pickVehicle(\'Tractor\')">🚜<br>TRACTOR</button></div>'}else if(state.step===2){html+='<h2>2️⃣ Material चुनें</h2><div class="materials">';mats.forEach(m=>html+='<button class="material" onclick="pickMaterial(this.dataset.m)" data-m="'+esc(m)+'">'+esc(m)+'</button>');html+='</div><div class="actions"><button class="btn back" onclick="state.step=1;render()">⬅️ वापस</button></div>'}else{html+='<h2>3️⃣ Entry जमा करें</h2><div class="info">गाड़ी: '+esc(state.vehicle)+'<br>Material: '+esc(state.material)+'</div><div class="actions"><button class="btn back" onclick="state.step=2;render()">⬅️ वापस</button><button class="btn submit" onclick="submitEntry()">✅ SUBMIT</button></div>'}app.innerHTML=html;status()}
function pickVehicle(v){state.vehicle=v;state.step=2;render()}function pickMaterial(m){state.material=m;state.step=3;render()}
async function submitEntry(){if(!state.vehicle||!state.material)return;if(!idb)await openDB();app.querySelectorAll('button').forEach(b=>b.disabled=true);const date=today(),time=timeNow(),entry={date,time,customer:'',vehicleType:state.vehicle,vehicle:'',material:state.material,photo:'',_id:'jcb_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)};app.innerHTML='<div class="info">⏳ Entry save हो रही है...</div>';try{await queueAdd({date,entry});app.innerHTML='<div class="success">✅ Entry Save हो गई<div style="font-size:14px;font-weight:600;margin-top:6px">Internet आते ही अपने-आप Sync हो जाएगी।</div><div class="actions"><button class="btn submit" onclick="state={step:1,vehicle:\'\',material:\'\'};render()">➕ अगली Entry</button></div></div>';await status();setTimeout(()=>{connectFirebase().then(()=>flushQueue()).catch(()=>{})},50)}catch(e){app.innerHTML='<div class="error">Entry फोन में save नहीं हो पाई। कृपया दोबारा दबाएँ।</div><div class="actions"><button class="btn back" onclick="state.step=3;render()">🔄 दोबारा कोशिश</button></div>'}}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
async function connectFirebase(){if(!navigator.onLine)return false;try{if(!window.firebase){await loadScript('https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js');await loadScript('https://www.gstatic.com/firebasejs/12.9.0/firebase-database-compat.js');await loadScript('https://www.gstatic.com/firebasejs/12.9.0/firebase-auth-compat.js')}if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);if(!firebase.auth().currentUser)await firebase.auth().signInAnonymously();dbRef=firebase.database().ref('chamundaERP/data');try{const snap=await dbRef.child('settings/materials').once('value'),m=snap.val();if(Array.isArray(m)&&m.length)materials=[...new Set(m.map(String).concat(['भराव']))]}catch(e){}await flushQueue();return true}catch(e){dbRef=null;syncBox.className='sync offline';syncBox.textContent='⚠️ Firebase Connect Error: '+(e.code||e.message||'unknown');return false}}
async function start(){render();openDB().then(async()=>{await connectFirebase();await status()}).catch(()=>status())}
window.addEventListener('online',async()=>{await connectFirebase();await flushQueue();status();});
window.addEventListener('offline',status);
window.addEventListener('load',()=>{if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})});
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='JCB_SYNC')connectFirebase().then(flushQueue)});setInterval(()=>{if(navigator.onLine)connectFirebase().then(flushQueue)},15000);
start();</script></body></html>
